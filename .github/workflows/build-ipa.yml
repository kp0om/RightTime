name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build without code signing
        run: |
          # 오류를 GitHub 화면의 annotation으로 보여 주고, 마지막 로그를 남긴다
          if ! xcodebuild -project RightTime.xcodeproj -scheme RightTime \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
            tail -40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep "/Sources/" | sort -u | head -20 | sed 's/^/::warning::/' || true

      - name: Show built Info.plist
        run: |
          echo "::notice title=Info.plist::$(plutil -convert json -o - build/Build/Products/Release-iphoneos/RightTime.app/Info.plist)"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RightTime.app Payload/
          zip -qr RightTime.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RightTime-ipa
          path: RightTime.ipa
